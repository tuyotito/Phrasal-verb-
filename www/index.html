<style>
:root{--bg:#EAF0F6;--ink:#12213A;--card:#fff;--muted:#52617A;--line:#C9D5E3;--tile:#FFC933;--tileink:#12213A;--ok:#1F8A5B;--bad:#C8432B;--btn:#12213A;--btnink:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A2B;--ink:#E8EEF7;--card:#17263D;--muted:#9DB0CA;--line:#2B3E5A;--ok:#4CC38A;--bad:#FF7A5C;--btn:#E8EEF7;--btnink:#0F1A2B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A2B;--ink:#E8EEF7;--card:#17263D;--muted:#9DB0CA;--line:#2B3E5A;--ok:#4CC38A;--bad:#FF7A5C;--btn:#E8EEF7;--btnink:#0F1A2B;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:2rem;margin:8px 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 20px}
nav{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--line)}
nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;font:600 1rem "Instrument Sans",sans-serif;color:var(--muted);cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tile)}
button:focus-visible,input:focus-visible{outline:3px solid var(--tile);outline-offset:2px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 18px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.stat{font-size:.95rem;color:var(--muted)}
.verb{display:flex;gap:8px;align-items:stretch;justify-content:center;flex-wrap:wrap;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(2rem,9vw,3rem);line-height:1}
.verb span{padding:14px 18px;border-radius:10px;background:var(--card);border:2px solid var(--line)}
.verb b{padding:14px 18px;border-radius:10px;background:var(--tile);color:var(--tileink);font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 20px;text-align:center;min-height:240px;display:flex;flex-direction:column;justify-content:center;gap:18px;cursor:pointer;width:100%;font:inherit;color:inherit}
.fr{font-size:1.5rem;font-weight:600}
.ex{color:var(--muted);margin:0}
.ex em{color:var(--ink);font-style:normal;font-weight:600}
.hint{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:13px 16px;border-radius:10px;border:2px solid var(--btn);background:var(--btn);color:var(--btnink);font:600 1rem "Instrument Sans",sans-serif;cursor:pointer}

var N=D.length,known={},tab="cards",queue=[],flipped=false,Q=null;
try{known=JSON.parse(localStorage.getItem("pv-known")||"{}")}catch(e){known={}}
var rev=false;try{rev=localStorage.getItem("pv-rev")==="1"}catch(e){}
function save(){try{localStorage.setItem("pv-known",JSON.stringify(known))}catch(e){}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function count(){return Object.keys(known).length}
function head(){var c=count();document.getElementById("stat").textContent=c+" sur "+N+" maîtrisés";document.getElementById("bar").style.width=(c/N*100)+"%"}
function tiles(i){return '<div class="verb"><span>'+esc(D[i][0])+'</span><b>'+esc(D[i][1])+'</b></div>'}
function rebuild(){queue=shuffle(D.map(function(_,i){return i}).filter(function(i){return !known[i]}));flipped=false}
function cards(){
var v=document.getElementById("view");
if(!queue.length){v.innerHTML='<div class="end"><h2>Tout est maîtrisé</h2><p class="ex">Les '+N+' phrasal verbs sont acquis. Lance un quiz pour les vérifier.</p><div class="row"><button class="btn" id="rs">Tout recommencer</button></div></div>';
document.getElementById("rs").onclick=function(){known={};save();rebuild();head();cards()};return}
var i=queue[0],d=D[i];
var ex=(d[3]?'<p class="ex"><em>'+esc(d[3])+'</em><br>'+esc(d[4])+'</p>':'');
var front=rev?'<div class="fr">'+esc(d[2])+'</div>':tiles(i);
var back=rev?tiles(i)+ex:'<div class="fr">'+esc(d[2])+'</div>'+ex;
v.innerHTML='<button class="card" id="cd" aria-label="Retourner la carte">'+front+(flipped?back:'<span class="hint">'+(rev?"Touche la carte pour voir l’anglais":"Touche la carte pour voir le sens")+'</span>')+'</button>'+
(flipped?'<div class="row"><button class="btn alt" id="rv">À revoir</button><button class="btn" id="ok">Je le connais</button></div>':'');
document.getElementById("cd").onclick=function(){flipped=!flipped;cards()};
if(flipped){document.getElementById("rv").onclick=function(){queue.push(queue.shift());flipped=false;cards()};
document.getElementById("ok").onclick=function(){known[i]=1;save();queue.shift();flipped=false;head();cards()}}
}
function newQuiz(){Q={ids:shuffle(D.map(function(_,i){return i})).slice(0,10),n:0,score:0,answered:false};quiz()}
function quiz(){
var v=document.getElementById("view");
if(Q.n>=Q.ids.length){v.innerHTML='<div class="end"><h2>'+Q.score+' sur '+Q.ids.length+'</h2><p class="ex">'+(Q.score>=8?"Excellent, tu les maîtrises.":"Retourne aux cartes pour revoir ceux qui t’ont échappé.")+'</p><div class="row"><button class="btn" id="again">Nouveau quiz</button></div></div>';
document.getElementById("again").onclick=newQuiz;return}
var i=Q.ids[Q.n],d=D[i];
var wrong=shuffle(D.map(function(_,k){return k}).filter(function(k){return k!==i&&D[k][2]!==d[2]})).slice(0,3);
var opts=shuffle([i].concat(wrong));
v.innerHTML='<p class="stat">Question '+(Q.n+1)+' sur '+Q.ids.length+'</p><div class="card" style="cursor:default;min-height:170px">'+(rev?'<div class="fr">'+esc(d[2])+'</div>':tiles(i)+(d[3]?'<p class="ex"><em>'+esc(d[3])+'</em></p>':''))+'</div><div class="opts" id="o">'+
opts.map(function(k){return '<button class="opt" data-k="'+k+'">'+esc(rev?D[k][0]+" "+D[k][1]:D[k][2])+'</button>'}).join("")+'</div><div id="nx"></div>';
Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(b){b.onclick=function(){
var k=+b.getAttribute("data-k"),good=k===i;
Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(x){x.disabled=true;if(+x.getAttribute("data-k")===i)x.classList.add("ok")});
if(good){Q.score++;known[i]=1;save();head()}else b.classList.add("bad");
document.getElementById("nx").innerHTML=(d[4]?'<p class="ex" style="margin-top:12px">'+esc(d[4])+'</p>':'')+'<div class="row"><button class="btn" id="go">'+(Q.n+1>=Q.ids.length?"Voir le score":"Question suivante")+'</button></div>';
var g=document.getElementById("go");g.focus();g.onclick=function(){Q.n++;quiz()}}})
}
function list(){
var v=document.getElementById("view");
v.innerHTML='<input type="search" id="q" placeholder="Chercher un verbe ou un sens" aria-label="Chercher"><ul class="list" id="l"></ul>';
var q=document.getElementById("q");
function draw(){var t=q.value.trim().toLowerCase();
document.getElementById("l").innerHTML=D.map(function(d,i){return {d:d,i:i}}).filter(function(o){return !t||(o.d[0]+" "+o.d[1]+" "+o.d[2]).toLowerCase().indexOf(t)>-1}).map(function(o){
return '<li><span class="k">'+esc(o.d[0])+' <u>'+esc(o.d[1])+'</u></span><span class="m">'+esc(o.d[2])+'</span>'+(known[o.i]?'<span class="d" title="Maîtrisé">✓</span>':'')+'</li>'}).join("")||'<li>Aucun résultat. Essaie un autre mot.</li>'}
q.oninput=draw;draw()}
function show(t){tab=t;
Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(b){b.setAttribute("aria-selected",b.getAttribute("data-t")===t)});
head();if(t==="cards"){if(!queue.length&&count()<N)rebuild();cards()}else if(t==="quiz")newQuiz();else list()}
Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(b){b.onclick=function(){show(b.getAttribute("data-t"))}});
function dirLabel(){document.getElementById("dir").textContent=rev?"Sens : français → anglais (changer)":"Sens : anglais → français (changer)"}
document.getElementById("dir").onclick=function(){rev=!rev;try{localStorage.setItem("pv-rev",rev?"1":"0")}catch(e){}dirLabel();flipped=false;show(tab)};
dirLabel();rebuild();show("cards");
</script>
